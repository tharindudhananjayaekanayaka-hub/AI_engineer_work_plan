<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ff96">
  <meta name="description" content="AI Engineer 90-Day Evidence-Based Training Dashboard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI CMD">

  <title>AI Engineer Command Center</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase JS Client (Local bundle — zero CDN latency) -->
  <script src="supabase.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050a0e'/><text y='70' x='15' font-size='65'>⚡</text></svg>">
</head>
<body>

  <!-- Boot Loader Overlay (Auto-fades after 1.5s failsafe) -->
  <div id="bootLoader" style="
    position: fixed; inset: 0;
    background: #050a0e;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 99999;
    gap: 20px;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  ">
    <div style="
      width: 50px; height: 50px;
      border: 3px solid rgba(0,255,150,0.2);
      border-top-color: #00ff96;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    "></div>
    <div style="font-family:'JetBrains Mono',monospace;color:#00ff96;font-size:12px;letter-spacing:0.12em">
      INITIALIZING COMMAND CENTER...
    </div>
  </div>

  <!-- App Mount Point -->
  <div id="app"></div>

  <!-- ============================================================
       SCRIPTS — Order: roadmap → recall → app
       ============================================================ -->
  <script src="roadmap.js"></script>
  <script src="recall.js"></script>
  <script src="app.js"></script>

  <!-- Loader Dismissal & PWA Registration -->
  <script>
    // Universal Loader Dismissal Function
    window.dismissLoader = function() {
      var loader = document.getElementById('bootLoader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    };

    // Failsafe: dismiss after at most 1.5s regardless of anything
    setTimeout(window.dismissLoader, 1500);

    // Register Service Worker
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }

    // Global error handler to catch any unexpected script error
    window.addEventListener('error', function(e) {
      window.dismissLoader();
      console.error('Command Center Error:', e);
    });
  </script>

</body>
</html>
