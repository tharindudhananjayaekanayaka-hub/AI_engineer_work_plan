<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ff96">
  <meta name="description" content="AI Engineer 90-Day Evidence-Based Training Dashboard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI CMD">

  <title>AI Engineer Command Center</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon (inline SVG as data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050a0e'/><text y='70' x='15' font-size='65'>⚡</text></svg>">
</head>
<body>

  <!-- App Mount Point -->
  <div id="app">
    <!-- Boot Loader -->
    <div id="bootLoader" style="
      position:fixed;inset:0;
      background:#050a0e;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:9999;
      gap:20px;
    ">
      <div style="
        width:60px;height:60px;
        border:3px solid rgba(0,255,150,0.2);
        border-top-color:#00ff96;
        border-radius:50%;
        animation:spin 1s linear infinite;
      "></div>
      <div style="font-family:'JetBrains Mono',monospace;color:#00ff96;font-size:13px;letter-spacing:0.1em">
        INITIALIZING COMMAND CENTER...
      </div>
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS — Order matters: roadmap → recall → app
       ============================================================ -->
  <script src="roadmap.js"></script>
  <script src="recall.js"></script>
  <script src="app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // Service worker failed — app still works
        });
      });
    }

    // Remove boot loader once app initializes
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loader = document.getElementById('bootLoader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.5s ease';
          setTimeout(() => loader.remove(), 500);
        }
      }, 800);
    });
  </script>

</body>
</html>
