<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090D16">
  <meta name="description" content="AI Engineer 90-Day Evidence-Based Training Dashboard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI CMD">

  <title>AI Engineer Command Center</title>

  <!-- Clean Service Workers & Cache immediately -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) {
          caches.delete(keys[i]);
        }
      });
    }

    // Global Error Boundary - ensure user never gets a mysterious black screen
    window.onerror = function(msg, url, line, col, error) {
      console.error('GLOBAL ERROR:', msg, url, line, col, error);
      var app = document.getElementById('app');
      var loader = document.getElementById('initial-loader');
      if (loader && app) {
        loader.innerHTML = '<div style="max-width:550px;background:rgba(239,68,68,0.1);border:1px solid #ef4444;padding:24px;border-radius:12px;text-align:left;">' +
          '<h3 style="color:#ef4444;margin-bottom:8px;font-size:16px;">⚠️ Script Loading Error</h3>' +
          '<p style="color:#e2e8f0;font-size:13px;margin-bottom:12px;">' + (msg || 'Error loading dashboard scripts') + '</p>' +
          '<p style="color:#94a3b8;font-size:11px;margin-bottom:16px;">' + (url ? url.split('/').pop() : 'script') + ':' + line + '</p>' +
          '<button onclick="localStorage.clear();location.reload();" style="background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:monospace;font-size:12px;">Reset Data & Reload</button>' +
        '</div>';
      }
    };
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase JS Client (local) -->
  <script src="supabase.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23090D16'/><text y='70' x='15' font-size='65'>⚡</text></svg>">
</head>
<body>

  <!-- Toast Container (global outside #app) -->
  <div id="toastContainer"></div>

  <!-- App Mount Point with instant visual feedback (never black screen) -->
  <div id="app">
    <div id="initial-loader" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; color:#10B981; font-family:'Inter', -apple-system, sans-serif; text-align:center; padding:20px;">
      <div style="font-size:40px; margin-bottom:16px;">⚡</div>
      <h2 style="font-size:20px; font-weight:700; margin-bottom:8px; color:#F8FAFC; letter-spacing:-0.5px;">AI ENGINEER COMMAND CENTER</h2>
      <p style="color:#94A3B8; font-size:13px; max-width:440px; margin-bottom:24px;">Initializing 90-Day Evidence-Based Training Protocol...</p>
      <div style="width:220px; height:4px; background:rgba(255,255,255,0.06); border-radius:4px; overflow:hidden;">
        <div style="width:60%; height:100%; background:#10B981; border-radius:4px;"></div>
      </div>
      <div id="loader-fallback" style="display:none; margin-top:28px;">
        <p style="color:#64748B; font-size:12px; margin-bottom:12px;">Taking longer than expected?</p>
        <button onclick="localStorage.clear(); location.reload();" style="background:rgba(255,255,255,0.06); color:#10B981; border:1px solid rgba(16,185,129,0.3); padding:8px 16px; border-radius:8px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:12px;">
          🔄 Clear Cache &amp; Reset
        </button>
      </div>
      <script>
        setTimeout(function() {
          var fb = document.getElementById('loader-fallback');
          if (fb) fb.style.display = 'block';
        }, 2500);
      </script>
    </div>
  </div>

  <!-- Scripts (roadmap → recall → app) -->
  <script src="roadmap.js"></script>
  <script src="recall.js"></script>
  <script src="app.js"></script>

</body>
</html>
